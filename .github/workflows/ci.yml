name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-read-version:
    name: Build and Read Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f go.mod || { echo "go.mod not found at repository root"; exit 1; }
          test -f VERSION || { echo "VERSION not found at repository root"; exit 1; }
          if [ ! -f cmd/veriflow/main.go ]; then
            echo "cmd/veriflow/main.go not found in the checked-out commit"
            echo "Working directory: $(pwd)"
            echo "Files under cmd/:"
            find cmd -maxdepth 2 -type f -print 2>/dev/null | sort || true
            echo "Git-tracked cmd paths:"
            git ls-files cmd || true
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          test -f VERSION || { echo "VERSION not found"; exit 1; }
          version="$(tr -d '[:space:]' < VERSION)"

          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "VERSION must look like 1.0.0 or 1.0.0-preview.1. Current value: $version"
            exit 1
          fi

          tag="v$version"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" != "$tag" ]]; then
            echo "Tag/version mismatch: pushed tag is ${GITHUB_REF_NAME}, VERSION requires $tag"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"
          echo "Resolved tag: $tag"

      - name: Build Veriflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/bootstrap
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build \
            -trimpath \
            -ldflags "-X veriflow/internal/engine.EngineVersion=${{ steps.version.outputs.version }} -X veriflow/internal/engine.BuildCommit=${GITHUB_SHA} -X veriflow/internal/engine.BuildDate=${build_date}" \
            -o .tmp/bootstrap/veriflow \
            ./cmd/veriflow

      - name: Verify built version
        shell: bash
        run: |
          set -euo pipefail
          version_json="$(.tmp/bootstrap/veriflow version --json)"
          actual="$(printf '%s' "$version_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          expected="${{ steps.version.outputs.version }}"
          if [ "$actual" != "$expected" ]; then
            echo "Built version mismatch: expected $expected, got $actual"
            exit 1
          fi
          .tmp/bootstrap/veriflow --help >/dev/null
          echo "Built Veriflow $actual successfully"

  quality:
    name: Go quality gates
    needs: build-and-read-version
    runs-on: ubuntu-latest
    env:
      MIN_INTERNAL_COVERAGE: "70.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test -count=1 -shuffle=on ./...

      - name: Run race detector
        run: go test -count=1 -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Generate and enforce internal coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          go test -count=1 -covermode=atomic -coverprofile=.tmp/coverage.out ./internal/...
          coverage="$(go tool cover -func=.tmp/coverage.out | awk '/^total:/{gsub(/%/, "", $3); print $3}')"
          echo "Internal coverage: ${coverage}% (minimum ${MIN_INTERNAL_COVERAGE}%)"
          awk -v actual="$coverage" -v minimum="$MIN_INTERNAL_COVERAGE" 'BEGIN { if ((actual + 0) < (minimum + 0)) exit 1 }'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: .tmp/coverage.out
          if-no-files-found: warn
          retention-days: 7

  cross-platform-tests:
    name: Tests ${{ matrix.platform }}
    needs: build-and-read-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-26-intel
            platform: macos-x64
          - os: macos-26
            platform: macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Run tests
        run: go test -count=1 ./...

      - name: Build CLI natively
        run: go build -trimpath -o ${{ runner.os == 'Windows' && 'veriflow-test.exe' || 'veriflow-test' }} ./cmd/veriflow

  smoke:
    name: Positive pipeline smoke
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Run self-contained smoke suite
        shell: bash
        run: bash ./scripts/pipeline-smoke.sh

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-smoke-output
          path: |
            .tmp/pipeline-positive/
            examples/project/artifacts/
          if-no-files-found: warn
          retention-days: 7

  negative-contracts:
    name: Expected-failure contracts
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Run expected-failure contract checks
        shell: bash
        run: bash ./scripts/pipeline-negative.sh

      - name: Upload expected-failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-negative-output
          path: .tmp/pipeline-negative/logs/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: [build-and-read-version, quality, cross-platform-tests, smoke, negative-contracts]

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            goos: windows
            goarch: amd64
            executable: veriflow.exe
            archive: zip

          - os: ubuntu-latest
            platform: linux-x64
            goos: linux
            goarch: amd64
            executable: veriflow
            archive: tar.gz

          - os: macos-26-intel
            platform: macos-x64
            goos: darwin
            goarch: amd64
            executable: veriflow
            archive: tar.gz

          - os: macos-26
            platform: macos-arm64
            goos: darwin
            goarch: arm64
            executable: veriflow
            archive: tar.gz

    env:
      APP_NAME: Veriflow
      APP_VERSION: ${{ needs.build-and-read-version.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      EXECUTABLE_NAME: ${{ matrix.executable }}
      ARCHIVE_EXTENSION: ${{ matrix.archive }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Build executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force dist | Out-Null

          $env:CGO_ENABLED = "0"
          $env:GOOS = "${{ matrix.goos }}"
          $env:GOARCH = "${{ matrix.goarch }}"
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $commit = "${{ github.sha }}"
          $ldflags = "-s -w -X veriflow/internal/engine.EngineVersion=$env:APP_VERSION -X veriflow/internal/engine.BuildCommit=$commit -X veriflow/internal/engine.BuildDate=$buildDate"

          go build `
            -trimpath `
            -ldflags $ldflags `
            -o "dist/$env:EXECUTABLE_NAME" `
            ./cmd/veriflow

          if (-not (Test-Path "dist/$env:EXECUTABLE_NAME")) {
            throw "Go build output not found: dist/$env:EXECUTABLE_NAME"
          }

      - name: Smoke test built executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $IsWindows) {
            chmod +x "dist/$env:EXECUTABLE_NAME"
          }

          & "./dist/$env:EXECUTABLE_NAME" --help
          if ($LASTEXITCODE -ne 0) {
            throw "Built executable --help smoke test failed"
          }

          $versionJson = & "./dist/$env:EXECUTABLE_NAME" version --json
          if ($LASTEXITCODE -ne 0) {
            throw "Built executable version smoke test failed"
          }
          $versionInfo = $versionJson | ConvertFrom-Json
          if ($versionInfo.version -ne $env:APP_VERSION) {
            throw "Built version mismatch: expected $env:APP_VERSION, got $($versionInfo.version)"
          }

          & "./dist/$env:EXECUTABLE_NAME" schema --output "dist/veriflow.schema.json"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "dist/veriflow.schema.json")) {
            throw "Built executable spec schema export failed"
          }

          & "./dist/$env:EXECUTABLE_NAME" schema config --output "dist/veriflow.project.schema.json"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "dist/veriflow.project.schema.json")) {
            throw "Built executable project schema export failed"
          }

      - name: Prepare release folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $releaseName = "$env:APP_NAME-$env:APP_VERSION-$env:PLATFORM"
          $releaseDir = "release/$releaseName"

          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item "dist/$env:EXECUTABLE_NAME" "$releaseDir/$env:EXECUTABLE_NAME" -Force
          Copy-Item "README.md" "$releaseDir/README.md" -Force
          Copy-Item "STABILITY.md" "$releaseDir/STABILITY.md" -Force
          Copy-Item "LICENSE" "$releaseDir/LICENSE" -Force
          Copy-Item "dist/veriflow.schema.json" "$releaseDir/veriflow.schema.json" -Force
          Copy-Item "dist/veriflow.project.schema.json" "$releaseDir/veriflow.project.schema.json" -Force

          "RELEASE_NAME=$releaseName" >> $env:GITHUB_ENV
          "RELEASE_DIR=$releaseDir" >> $env:GITHUB_ENV

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "$env:RELEASE_NAME.zip"
          Compress-Archive -Path "$env:RELEASE_DIR/*" -DestinationPath $archive -Force
          if (-not (Test-Path $archive)) { throw "Archive not created: $archive" }

      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RELEASE_NAME.tar.gz"
          tar -czf "$archive" -C release "$RELEASE_NAME"
          test -f "$archive"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-and-read-version, build]

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.zip *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-and-read-version.outputs.tag }}
          name: Veriflow ${{ needs.build-and-read-version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/checksums.txt
