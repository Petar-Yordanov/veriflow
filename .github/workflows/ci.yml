name: CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read-version:
    name: Read version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          project_path="packages/veriflow-cli/pyproject.toml"

          if [ ! -f "$project_path" ]; then
            echo "$project_path not found"
            exit 1
          fi

          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          path = Path("packages/veriflow-cli/pyproject.toml")

          with path.open("rb") as f:
              data = tomllib.load(f)

          version = (
              data.get("project", {}).get("version")
              or data.get("tool", {}).get("poetry", {}).get("version")
          )

          if not version:
              raise SystemExit("Version not found in pyproject.toml")

          print(version)
          PY
          )"

          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "Version must look like 1.0.0 or 1.0.0-preview.1. Current value: $version"
            exit 1
          fi

          tag="v$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          echo "Resolved version: $version"
          echo "Resolved tag: $tag"

  build:
    name: Build ${{ matrix.platform }}
    needs: read-version

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            python-architecture: x64
            executable-name: veriflow.exe
            archive-extension: zip

          - os: ubuntu-latest
            platform: linux-x64
            python-architecture: x64
            executable-name: veriflow
            archive-extension: tar.gz

          - os: macos-15-intel
            platform: macos-x64
            python-architecture: x64
            executable-name: veriflow
            archive-extension: tar.gz

          - os: macos-14
            platform: macos-arm64
            python-architecture: arm64
            executable-name: veriflow
            archive-extension: tar.gz

    runs-on: ${{ matrix.os }}

    env:
      APP_NAME: Veriflow
      APP_VERSION: ${{ needs.read-version.outputs.version }}
      APP_TAG: ${{ needs.read-version.outputs.tag }}
      PLATFORM: ${{ matrix.platform }}
      EXECUTABLE_NAME: ${{ matrix.executable-name }}
      ARCHIVE_EXTENSION: ${{ matrix.archive-extension }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-architecture }}

      - name: Install Poetry
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip
          python -m pip install poetry

          poetry --version

      - name: Install package dependencies
        shell: pwsh
        working-directory: packages/veriflow-cli
        run: |
          $ErrorActionPreference = "Stop"

          poetry config virtualenvs.in-project true
          poetry install --no-interaction

          poetry run python -m pip install --upgrade pyinstaller

      - name: Build executable with PyInstaller
        shell: pwsh
        working-directory: packages/veriflow-cli
        run: |
          $ErrorActionPreference = "Stop"

          poetry run pyinstaller `
            --clean `
            --onefile `
            --name "veriflow" `
            --paths "../spec-engine/src" `
            "src/veriflow_cli/main.py"

          if (-not (Test-Path "dist/$env:EXECUTABLE_NAME")) {
            Write-Host "=== dist contents ==="
            Get-ChildItem -Path dist -Recurse | Select-Object FullName | Format-Table -AutoSize | Out-String -Width 4096 | Write-Host
            throw "PyInstaller output not found: dist/$env:EXECUTABLE_NAME"
          }

      - name: Smoke test executable
        shell: pwsh
        working-directory: packages/veriflow-cli
        run: |
          $ErrorActionPreference = "Stop"

          if ($IsWindows) {
            & "dist/veriflow.exe" --help
          }
          else {
            chmod +x "dist/veriflow"
            & "dist/veriflow" --help
          }

      - name: Prepare release folder
        shell: pwsh
        working-directory: packages/veriflow-cli
        run: |
          $ErrorActionPreference = "Stop"

          $releaseName = "$env:APP_NAME-$env:APP_VERSION-$env:PLATFORM"
          $releaseDir = "release/$releaseName"

          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          Copy-Item "dist/$env:EXECUTABLE_NAME" "$releaseDir/$env:EXECUTABLE_NAME" -Force

          if (Test-Path "README.md") {
            Copy-Item "README.md" "$releaseDir/README.md" -Force
          }

          if (Test-Path "../../LICENSE") {
            Copy-Item "../../LICENSE" "$releaseDir/LICENSE" -Force
          }

          "RELEASE_NAME=$releaseName" >> $env:GITHUB_ENV
          "RELEASE_DIR=$releaseDir" >> $env:GITHUB_ENV

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: packages/veriflow-cli
        run: |
          $ErrorActionPreference = "Stop"

          $archive = "$env:RELEASE_NAME.zip"

          Compress-Archive `
            -Path "$env:RELEASE_DIR/*" `
            -DestinationPath $archive `
            -Force

          if (-not (Test-Path $archive)) {
            throw "Archive not created: $archive"
          }

      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        working-directory: packages/veriflow-cli
        run: |
          set -euo pipefail

          archive="$RELEASE_NAME.tar.gz"

          tar -czf "$archive" -C "release" "$RELEASE_NAME"

          if [ ! -f "$archive" ]; then
            echo "Archive not created: $archive"
            exit 1
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: packages/veriflow-cli/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-${{ matrix.platform }}.${{ matrix.archive-extension }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [read-version, build]

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 3 -type f -print

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.read-version.outputs.tag }}
          name: Veriflow ${{ needs.read-version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.tar.gz